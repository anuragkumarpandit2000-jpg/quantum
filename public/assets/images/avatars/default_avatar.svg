<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="quantumBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="quantumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="quantumGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="98" fill="url(#quantumBg)" stroke="url(#quantumBorder)" stroke-width="3" />

  <!-- Subtle Quantum Grid Lines in Background -->
  <path d="M 40 100 L 160 100 M 100 40 L 100 160" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />

  <!-- Head Silhouette -->
  <circle cx="100" cy="74" r="28" fill="url(#quantumGlow)" filter="url(#softGlow)" />

  <!-- Shoulders & Torso -->
  <path d="M 42 165 C 42 125, 68 116, 100 116 C 132 116, 158 125, 158 165 C 158 178, 145 186, 100 186 C 55 186, 42 178, 42 165 Z" fill="url(#quantumGlow)" />

  <!-- Quantum Core Shield Accent on Chest -->
  <polygon points="100,126 108,138 100,150 92,138" fill="#38bdf8" fill-opacity="0.9" filter="url(#softGlow)" />
</svg>
